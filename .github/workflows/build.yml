name: Cross-Platform Build & Deploy

on:
  workflow_dispatch:
  #push:
  #  branches: [ main ]
  #  tags: [ 'v*' ]
  #pull_request:
  #  branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-mingw
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: x64-osx

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # Fetch full history for changelog generation

    # --- SETUP CACHING FOR DEPENDENCIES ---
    - name: Setup vcpkg Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          ${{ github.workspace }}/vcpkg/installed
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-

    # --- SETUP C++ COMPILERS & TOOLS ---
    - name: Setup MinGW Toolchain (Windows Only)
      if: matrix.os == 'windows-latest'
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Ensure MSYS2 and Mingw packages (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-winpthreads

    - name: Install System Dependencies (Linux Only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libpulse-dev libasound2-dev libx11-xcb-dev libglu1-mesa-dev pkg-config

    # --- INSTALL QT ---
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.1' # Adjust to your target Qt version
        arch: ${{ matrix.os == 'windows-latest' && 'win64_mingw' || '' }}
        cache: true

    # --- DEPENDENCY MANAGEMENT VIA VCPKG ---
    - name: Install FFmpeg Shared via vcpkg (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        git clone https://github.com/microsoft/vcpkg vcpkg-dir
        ./vcpkg-dir/bootstrap-vcpkg.sh
        # Force vcpkg to build dynamic shared libraries (.dll/.so/.dylib)
        ./vcpkg-dir/vcpkg install ffmpeg[avcodec,avformat,avutil,swscale] --triplet=${{ matrix.triplet }} --clean-after-build
      shell: bash

    - name: Install FFmpeg Shared via vcpkg (Windows - MinGW)
      if: matrix.os == 'windows-latest'
      run: |
        git clone https://github.com/microsoft/vcpkg vcpkg-dir
        .\vcpkg-dir\bootstrap-vcpkg.bat
        .\vcpkg-dir\vcpkg install ffmpeg[avcodec,avformat,avutil,swscale] --triplet=${{ matrix.triplet }} --clean-after-build
      shell: pwsh

    # --- BUILD APPLICATION ---
    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=./vcpkg-dir/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          ${{ matrix.os == 'windows-latest' && '-G "MinGW Makefiles"' || '' }}
      shell: bash

    - name: Run Build
      run: cmake --build build --config Release

    # --- PACKAGE & DEPLOY STRATEGIES PER OS ---

    # 1. WINDOWS PACKAGING (MinGW + windeployqt) - create a ZIP around the installer
    - name: Debug list vcpkg and build outputs (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "vcpkg installed tree:"
        ls -la vcpkg-dir/installed || true
        echo "--- vcpkg x64-mingw bin ---"
        ls -la vcpkg-dir/installed/x64-mingw/bin || true
        echo "--- build tree (looking for vura.exe) ---"
        find build -type f -iname "vura.exe" -print || true
      shell: pwsh

    - name: Package Windows Installer via NSIS
      if: matrix.os == 'windows-latest'
      run: |
        set -e
        mkdir -p dist_windows
        mkdir -p artifacts

        # locate the built exe (flexible path)
        EXE_PATH=$(bash -lc "find build -type f -iname 'vura.exe' | head -n1")
        if [ -z "$EXE_PATH" ]; then
          echo "ERROR: vura.exe not found in build directory"; find build -maxdepth 4 -type f -ls || true; exit 1
        fi

        cp "$EXE_PATH" dist_windows/
        windeployqt --dir dist_windows "dist_windows/$(basename $EXE_PATH)"

        # Copy FFmpeg runtime DLLs generated by vcpkg (MinGW)
        cp vcpkg-dir/installed/x64-mingw/bin/*.dll dist_windows/ || true

        # Create NSIS installer (makensis is available on windows-latest runners)
        "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

        # After makensis, find the produced installer and zip it
        INSTALLER_PATH=$(bash -lc "find . -maxdepth 3 -type f -iname 'vura-setup-*.exe' | head -n1")
        if [ -z "$INSTALLER_PATH" ]; then
          # fallback: check common location
          INSTALLER_PATH="vura-setup.exe"
        fi
        echo "Installer produced at: $INSTALLER_PATH"

        # Move/copy the installer into artifacts and create a zip around it
        cp "$INSTALLER_PATH" ./artifacts/vura-windows-setup.exe || true
        (cd artifacts && zip -j vura-windows.zip vura-windows-setup.exe) || true

        echo "Packaged artifacts:"; ls -la artifacts || true
      shell: bash


    # 2. MACOS PACKAGING (.app bundle + macdeployqt)
    - name: Package macOS Artifacts
      if: matrix.os == 'macos-latest'
      run: |
        macdeployqt build/vura.app -verbose=1
        # Bundle shared vcpkg .dylib files explicitly if macdeployqt skips them
        mkdir -p build/vura.app/Contents/Frameworks
        cp vcpkg-dir/installed/x64-osx/lib/*.dylib build/vura.app/Contents/Frameworks/
        # Fix dynamic link references inside the app
        for f in build/vura.app/Contents/Frameworks/*.dylib; do
          install_name_tool -id "@executable_path/../Frameworks/$(basename $f)" "$f"
        done
        zip -r vura-mac.zip build/vura.app
      shell: bash

    # 3. LINUX PACKAGING (AppImage)
    - name: Package Linux Artifacts
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget -c https://github.com
        chmod +x linuxdeployqt-continuous-x86_64.AppImage
        # Ensure our executable knows where to search for vcpkg's compiled .so engines
        export LD_LIBRARY_DIR=$LD_LIBRARY_DIR:${{ github.workspace }}/vcpkg-dir/installed/x64-linux/lib
        # Generate self-contained AppImage bundle
        ./linuxdeployqt-continuous-x86_64.AppImage build/vura.app -appimage -always-overwrite
        mv vura-*.AppImage vura-Linux.AppImage
      shell: bash

    # --- UPLOAD ZIP / APPIMAGE TO GITHUB ACTIONS ---
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vura-${{ matrix.os }}
        path: |
          ./artifacts/*.zip
          ./artifacts/*.AppImage
          ./artifacts/*.exe

# Add this underneath your existing matrix build job:
  upload-to-r2:
    name: Upload Artifacts to Cloudflare R2
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: vura-windows-latest
        path: ./artifacts

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: vura-macos-latest
        path: ./artifacts

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: vura-ubuntu-latest
        path: ./artifacts

    
    # --- GENERATE DYNAMIC UPDATE MANIFEST WITH SHA-256 ---
    - name: Generate latest.json Metadata
      run: |
        VERSION_NAME="${{ github.ref_name }}"
        RELEASE_DATE=$(date +'%Y-%m-%d')
        CDN_BASE_URL="https://storage.hale-tech.net"
        
        # Calculate SHA-256 hashes of the downloaded pipeline assets safely
        # awk extracts just the hash from the 'hash filename' standard output string
        WIN_HASH=$(sha256sum ./artifacts/vura-windows.zip | awk '{print $1}')
        MAC_HASH=$(sha256sum ./artifacts/vura-mac.zip | awk '{print $1}')
        LINUX_HASH=$(sha256sum ./artifacts/vura-linux.AppImage | awk '{print $1}')
        
        IS_BETA="false"
        if [[ "$VERSION_NAME" == *"-beta"* ]] || [[ "$VERSION_NAME" == "main" ]]; then
          IS_BETA="true"
        fi
        
        cat <<EOF > ./artifacts/latest.json
        {
          "version": "$VERSION_NAME",
          "release_date": "$RELEASE_DATE",
          "is_beta": $IS_BETA,
          "changelog_url": "https://storage.hale-tech.net",
          "platforms": {
            "windows": { "url": "$CDN_BASE_URL/vura-windows-setup.exe", "sha256": "$WIN_HASH" },
            "mac": { "url": "$CDN_BASE_URL/vura-mac.zip", "sha256": "$MAC_HASH" },
            "linux": { "url": "$CDN_BASE_URL/vura-linux.AppImage", "sha256": "$LINUX_HASH" }
          }
        }
        EOF
        
        echo "Generated secure manifest:"
        cat ./artifacts/latest.json
      shell: bash


    # --- CLOUDFLARE R2 S3 COMPATIBLE UPLOAD LAYER ---
    - name: Upload Binaries to Cloudflare R2
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --follow-symlinks --delete --cache-control "max-age=0, no-cache, no-store, must-revalidate"
      env:
        AWS_S3_BUCKET: 'vura' # Replace with your exact R2 bucket name
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # Point the endpoint to your specific Cloudflare storage endpoint
        AWS_S3_ENDPOINT: ${{ secrets.R2_ACCOUNT_ENDPOINT }}
        AWS_REGION: 'auto' # Cloudflare R2 requires region set to 'auto'
        SOURCE_DIR: './artifacts'
        # If it's a tag, upload to 'downloads/v1.0.0/', otherwise upload to 'downloads/main/'
        DEST_DIR: "downloads/${{ github.ref_name }}"


    # --- AUTOMATIC CATEGORIZED HTML CHANGELOG GENERATOR ---
    - name: Auto-Generate HTML Changelog
      run: |
        VERSION_NAME="${{ github.ref_name }}"
        OUTPUT_FILE="./artifacts/changelog.html"

        # 1. Start the HTML scaffolding template with updated styles
        cat <<EOF > $OUTPUT_FILE
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 10px; color: #333; background-color: #fff; font-size: 13px; line-h[...]
                h3 { color: #0275d8; margin-top: 0; margin-bottom: 4px; padding-bottom: 5px; }
                .date { font-size: 11px; color: #777; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
                h4 { color: #292b2c; margin-top: 14px; margin-bottom: 6px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
                .feat-title { color: #5cb85c; }
                .fix-title { color: #d9534f; }
                ul { margin: 0; padding-left: 20px; }
                li { margin-bottom: 5px; }
                .empty-msg { font-style: italic; color: #999; list-style-type: none; margin-left: -20px; }
            </style>
        </head>
        <body>
            <h3>What's New in $VERSION_NAME</h3>
            <div class="date">Released on $(date +'%Y-%m-%d')</div>
        EOF

                # 1. Fetch tags explicitly to ensure local index alignment
        git fetch --tags --force

        CURRENT_TAG="${{ github.ref_name }}"
        
        # 2. Programmatically locate the nearest ancestor tag
        # 'abbrev=0' strips the commit hash suffix, leaving just the raw tag name
        # 'tags' forces matching against lightweight or annotated release tags
        PREV_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")

        # 3. Compute raw log array matching the exact git delta
        if [ -z "$PREV_TAG" ]; then
            echo "No previous tag detected. Compiling entire history up to $CURRENT_TAG..."
            RAW_LOGS=$(git log --pretty=format:"%s" "$CURRENT_TAG")
        else
            echo "Extracting delta range log: $PREV_TAG -> $CURRENT_TAG"
            RAW_LOGS=$(git log --pretty=format:"%s" "$PREV_TAG..$CURRENT_TAG")
        fi


        # 2. Extract and Parse FEATURES Section
        echo "<h4><span class='feat-title'>🚀 New Features</span></h4>" >> $OUTPUT_FILE
        echo "<ul>" >> $OUTPUT_FILE
        
        FEATS=$(echo "$RAW_LOGS" | grep -E "^feat(\(.*\))?:" | sed -E 's/^feat(\(.*\))?:[[:space:]]*/<li>/' | sed 's/$/<\/li>/')
        if [ -z "$FEATS" ]; then
            echo "<li class='empty-msg'>No new features in this release.</li>" >> $OUTPUT_FILE
        else
            echo "$FEATS" >> $OUTPUT_FILE
        fi
        echo "</ul>" >> $OUTPUT_FILE

        # 3. Extract and Parse BUG FIXES Section
        echo "<h4><span class='fix-title'>🔧 Bug Fixes</span></h4>" >> $OUTPUT_FILE
        echo "<ul>" >> $OUTPUT_FILE
        
        FIXES=$(echo "$RAW_LOGS" | grep -E "^fix(\(.*\))?:" | sed -E 's/^fix(\(.*\))?:[[:space:]]*/<li>/' | sed 's/$/<\/li>/')
        if [ -z "$FIXES" ]; then
            echo "<li class='empty-msg'>No bug fixes in this release.</li>" >> $OUTPUT_FILE
        else
            echo "$FIXES" >> $OUTPUT_FILE
        fi
        echo "</ul>" >> $OUTPUT_FILE

        # 4. Close HTML tags safely
        cat <<EOF >> $OUTPUT_FILE
        </body>
        </html>
        EOF

        echo "Changelog HTML generated successfully:"
        cat $OUTPUT_FILE
      shell: bash



    # --- COPY TRACK-SPECIFIC ROOT MANIFESTS ---
    - name: Push Track Manifests to R2
      run: |
        VERSION_NAME="${{ github.ref_name }}"
        
        # If it's a beta or main branch push, update beta track manifest
        if [[ "$VERSION_NAME" == *"-beta"* ]] || [[ "$VERSION_NAME" == "main" ]]; then
          aws s3 cp ./artifacts/latest.json s3://vura/tracks/beta.json --endpoint-url ${{ secrets.R2_ACCOUNT_ENDPOINT }} --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        else
          # Otherwise, update both the stable channel and beta channel tracks
          aws s3 cp ./artifacts/latest.json s3://vura/tracks/stable.json --endpoint-url ${{ secrets.R2_ACCOUNT_ENDPOINT }} --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          aws s3 cp ./artifacts/latest.json s3://vura/tracks/beta.json --endpoint-url ${{ secrets.R2_ACCOUNT_ENDPOINT }} --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'auto'
      shell: bash


